<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNL Decryptor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffffff 0%, #e0bbff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(128, 0, 128, 0.2);
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(128, 0, 128, 0.1) 0%, transparent 70%);
            z-index: -1;
        }

        h1 {
            text-align: center;            color: #6a0dad;
            margin-bottom: 30px;
            font-size: 2.5rem;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #6a0dad, transparent);
            border-radius: 2px;
        }

        .upload-area {
            border: 3px dashed #6a0dad;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(106, 13, 173, 0.05);
        }

        .upload-area:hover {
            background: rgba(106, 13, 173, 0.1);
            transform: translateY(-5px);
        }

        .upload-area i {
            font-size: 3rem;
            color: #6a0dad;
            margin-bottom: 15px;
        }

        .upload-area p {
            color: #6a0dad;
            font-weight: 500;
        }

        .file-input {
            display: none;
        }

        .text-input {            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #6a0dad;
            border-radius: 10px;
            resize: vertical;
            font-size: 1rem;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: #8a2be2;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.3);
        }

        .btn {
            background: linear-gradient(45deg, #6a0dad, #8a2be2);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(106, 13, 173, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 25px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(106, 13, 173, 0.2);
            border-top: 5px solid #6a0dad;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: rgba(106, 13, 173, 0.1);
            border-radius: 10px;
            text-align: center;
        }

        .result a {
            display: inline-block;
            background: linear-gradient(45deg, #6a0dad, #8a2be2);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s ease;
        }
        .result a:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(106, 13, 173, 0.3);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: translateX(120%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: linear-gradient(45deg, #4CAF50, #2E7D32);
        }

        .notification.error {
            background: linear-gradient(45deg, #f44336, #c62828);
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(106, 13, 173, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(106, 13, 173, 0); }
            100% { box-shadow: 0 0 0 0 rgba(106, 13, 173, 0); }
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .glowing-border {
            position: relative;
        }

        .glowing-border::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #6a0dad, #8a2be2, #6a0dad, #8a2be2);
            border-radius: 17px;
            z-index: -1;
            animation: glowing-border 3s linear infinite;
            background-size: 300% 300%;
        }

        @keyframes glowing-border {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>
    <div class="container floating">
        <h1>TNL Decryptor</h1>
        
        <div class="upload-area" id="dropZone">
            <i>📁</i>
            <p>Drag & Drop your .tnl file here</p>
            <p>or</p>
            <button class="btn" id="browseBtn">Browse Files</button>
            <input type="file" id="fileInput" class="file-input" accept=".tnl">
        </div>

        <textarea 
            class="text-input" 
            id="textInput" 
            placeholder="Or paste your TNL content here (Base64 or raw)..."></textarea>

        <button class="btn pulse" id="processBtn">Decrypt & Process</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Decrypting your file... Please wait</p>
        </div>
        <div class="result" id="result">
            <h3>🎉 Decryption Successful!</h3>
            <p>Your file has been processed successfully.</p>
            <a href="#" id="downloadLink">Download TXT File</a>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('dropZone');
            const browseBtn = document.getElementById('browseBtn');
            const fileInput = document.getElementById('fileInput');
            const textInput = document.getElementById('textInput');
            const processBtn = document.getElementById('processBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const downloadLink = document.getElementById('downloadLink');
            const notification = document.getElementById('notification');

            browseBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    dropZone.querySelector('p').textContent = e.target.files[0].name;
                }
            });

            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropZone.style.borderColor = '#8a2be2';
                    dropZone.style.backgroundColor = 'rgba(138, 43, 226, 0.1)';
                });
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropZone.style.borderColor = '#6a0dad';
                    dropZone.style.backgroundColor = 'rgba(106, 13, 173, 0.05)';
                });
            });

            dropZone.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    fileInput.files = files;
                    dropZone.querySelector('p').textContent = files[0].name;                }
            });

            processBtn.addEventListener('click', async () => {
                const file = fileInput.files[0];
                const text = textInput.value.trim();

                if (!file && !text) {
                    showNotification('Please select a file or enter text', 'error');
                    return;
                }

                try {
                    loading.style.display = 'block';
                    result.style.display = 'none';

                    const formData = new FormData();
                    if (file) {
                        formData.append('file', file);
                    } else {
                        formData.append('text', text);
                    }

                    const response = await fetch('/api/process', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Processing failed');
                    }

                    downloadLink.href = `/api/download/${data.uuid}`;
                    loading.style.display = 'none';
                    result.style.display = 'block';
                    showNotification('File processed successfully!', 'success');
                } catch (error) {
                    loading.style.display = 'none';
                    showNotification(error.message, 'error');
                }
            });

            function showNotification(message, type) {
                notification.textContent = message;
                notification.className = `notification ${type} show`;
                
                setTimeout(() => {
                    notification.classList.remove('show');                }, 3000);
            }
        });
    </script>
</body>
</html>
